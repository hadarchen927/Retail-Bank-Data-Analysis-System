server:
  port: 9090

spring:
  # 1. 数据库配置
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    # 确保这里的数据库名 bank_system 与你在 MySQL 中创建的名字一致
    url: jdbc:mysql://localhost:3306/bank_system?useUnicode=true&characterEncoding=utf-8&allowMultiQueries=true&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: root
    password: root

  # 2. 文件上传限制
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 100MB

  # 3. 路径匹配策略
  mvc:
    pathmatch:
      matching-strategy: ant_path_matcher

  # 4. Redis 配置
  data:
    redis:
      database: 1
      host: localhost
      port: 6379

  # 5. RabbitMQ (任务书虽未强制要求，但你配置中已有，予以保留)
  rabbitmq:
    port: 5672
    host: localhost

# 6. 修改为 mybatis-plus
mybatis-plus:
  # 对应你真实的包路径
  type-aliases-package: seig.retail_bank_analysis_system.entity
  mapper-locations: classpath:/mapper/*.xml
  configuration:
    # 在控制台打印 SQL 语句，方便调试
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
    # 开启下划线转驼峰 (annual_income -> annualIncome)
    map-underscore-to-camel-case: true

# 7. 分页插件配置
pagehelper:
  helper-dialect: mysql
  reasonable: true
  support-methods-arguments: true
  params: count=countSql

# 8. Python 引擎配置
python:
  env:
    # 你的 Python 可执行文件绝对路径 (如果是 Linux，可以改成 /usr/bin/python3)
    exe-path: D:/Anaconda/python.exe
    # cluster_analysis.py 脚本的绝对路径
    script-path: D:/retail-bank-analysis-system/backend/python/cluster_analysis.py
    # 临时数据交互文件夹路径 (需确保以 / 结尾)
    data-folder: D:/retail-bank-analysis-system/data/

# 自定义属性
ip: localhost